[package]
name = "yggdrasil-py"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
yggdrasil-embed = { path = "../yggdrasil-embed" }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
hex = "0.4"

# Standalone workspace (excluded from the root one); keep in sync with the
# root Cargo.toml.
[workspace]

[patch.crates-io]
salsa20 = { path = "../salsa20-simd" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
