[package]
name = "yggdrasil-ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI for an embedded Yggdrasil node; connections are handed out as OS sockets"
license = "MPL-2.0"

[lib]
name = "ygg"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
yggdrasil-embed = { path = "../yggdrasil-embed", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["ws", "quic"]
# Peering transports; tcp:// and tls:// are always available.
ws = ["yggdrasil-embed/ws"]
quic = ["yggdrasil-embed/quic"]

[dev-dependencies]
libc = "0.2"
