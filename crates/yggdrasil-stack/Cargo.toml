[package]
name = "yggdrasil-stack"
version = "0.1.0"
edition = "2024"
description = "Userspace TCP/UDP/ICMPv6 stack over an embedded Yggdrasil node (no TUN)"
license = "MPL-2.0"

[dependencies]
yggdrasil = { path = "../yggdrasil", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
rand = "0.8"
rustc-hash = "2.1.3"

[dependencies.smoltcp]
version = "0.14"
default-features = false
features = [
    "std",
    "medium-ip",
    "proto-ipv6",
    "socket-tcp",
    "socket-tcp-cubic",
    "socket-udp",
    "socket-icmp",
    "async",
    "auto-icmp-echo-reply",
]

[features]
default = []
# Pass-through peering transports of the node (tcp:// and tls:// are always on).
ws = ["yggdrasil/ws"]
quic = ["yggdrasil/quic"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
ed25519-dalek = "2"
