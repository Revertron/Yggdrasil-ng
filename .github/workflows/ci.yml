name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace

      # Keep the slim build (no ws/quic — e.g. OpenWrt) compiling.
      - name: Check slim build
        run: cargo check -p yggdrasil --no-default-features --features ctl,tun,systemd,ckr

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and test the Python package
        working-directory: crates/yggdrasil-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          maturin develop
          pytest -q tests

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Generated bindings are up to date
        run: |
          bindings/kotlin/generate.sh
          git diff --exit-code -- bindings/kotlin/src/main/kotlin

      - name: Test the Kotlin bindings on the JVM
        working-directory: bindings/kotlin
        run: gradle test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # AGP 8.7 needs Gradle 8.x.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libyggdrasil_uniffi.so for the emulator
        env:
          # A fast release build is enough for tests.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bindings/android/build-native.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: bindings/android
          script: gradle connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: bindings/android/build/reports/androidTests
